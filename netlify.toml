[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# El libro y el formulario son privados: que no aparezcan en buscadores
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# No publicar archivos internos del proyecto
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/LEEME.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
